<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<div id="stage">
  <div id="sky" class="layer">
    <video id="live-wallpaper" muted loop playsinline preload="none"></video>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span><span class="weather"></span></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
    <div id="identity">Free My TV<span>by KowalskiJr<span id="local-ip"></span></span></div>
  </div>
  <div id="more-hint" aria-hidden="true"></div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="wallpaper.js"></script>
<script src="home.js"></script>
</body>
</html>
