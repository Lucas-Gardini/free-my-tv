name: Android safety checks

on:
  pull_request:
    paths: ["app/**", "tests/**", "build.sh", "config.example.properties", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Home mode regression tests
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          bash tests/home-mode.sh
      - name: Build Android APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          bash build.sh
